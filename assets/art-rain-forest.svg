<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850" role="img" aria-label="Rừng núi đá vôi Nam Xung trong mưa xuân">
  <defs>
    <linearGradient id="rSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c443c" />
      <stop offset="48%" stop-color="#48685c" />
      <stop offset="100%" stop-color="#243a31" />
    </linearGradient>
    <radialGradient id="rLantern" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#ffe7a8" stop-opacity="0.58" />
      <stop offset="55%" stop-color="#9cc0a9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2c443c" stop-opacity="0" />
    </radialGradient>
    <g id="rainBlossom">
      <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.25" />
      <ellipse cx="0" cy="-8" rx="3.8" ry="7.2" fill="#ffffff" />
      <ellipse cx="0" cy="-8" rx="3.8" ry="7.2" fill="#faf4e4" transform="rotate(72)" />
      <ellipse cx="0" cy="-8" rx="3.8" ry="7.2" fill="#faf4e4" transform="rotate(144)" />
      <ellipse cx="0" cy="-8" rx="3.8" ry="7.2" fill="#ffffff" transform="rotate(216)" />
      <ellipse cx="0" cy="-8" rx="3.8" ry="7.2" fill="#ffffff" transform="rotate(288)" />
      <circle cx="0" cy="0" r="3" fill="#e6b249" />
    </g>
  </defs>

  <rect width="600" height="850" fill="url(#rSky)" />
  <rect width="600" height="850" fill="url(#rLantern)" />

  <!-- Distant mountain silhouette -->
  <path d="M0,560 L90,410 L185,468 L280,340 L375,445 L480,365 L600,455 L600,850 L0,850 Z" fill="#2b453b" opacity="0.85" />
  <path d="M0,635 Q180,575 340,630 T600,605 L600,850 L0,850 Z" fill="#20362d" />

  <!-- Overhanging spring tree -->
  <path d="M-10,850 C22,680 35,515 26,385 C18,268 72,182 190,132 C125,186 84,265 92,380 C102,510 88,680 62,850 Z" fill="#182b23" />
  <path d="M78,290 C165,245 270,225 380,252 C278,255 180,278 96,326 Z" fill="#182b23" />

  <!-- Soft blossom clusters on upper tree -->
  <g fill="#d9efe3" opacity="0.24">
    <circle cx="165" cy="185" r="46" />
    <circle cx="240" cy="215" r="54" />
    <circle cx="320" cy="245" r="42" />
    <circle cx="122" cy="252" r="38" />
  </g>
  <use href="#rainBlossom" transform="translate(210, 212) scale(0.95)" />
  <use href="#rainBlossom" transform="translate(288, 240) scale(0.8)" />
  <use href="#rainBlossom" transform="translate(152, 232) scale(0.75)" />

  <!-- Foreground mossy rocks and meadow -->
  <path d="M0,745 Q160,700 325,745 T600,725 L600,850 L0,850 Z" fill="#172c22" />
  <path d="M62,810 Q94,760 132,805 Z" fill="#324c40" />
  <path d="M462,818 Q505,762 552,816 Z" fill="#324c40" />
  <use href="#rainBlossom" transform="translate(115, 765) scale(1.1)" />
  <use href="#rainBlossom" transform="translate(490, 772) scale(1.05)" />

  <!-- Fine spring drizzle streaks -->
  <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.22">
    <line x1="80" y1="80" x2="68" y2="132" />
    <line x1="220" y1="65" x2="206" y2="122" />
    <line x1="395" y1="95" x2="380" y2="155" />
    <line x1="515" y1="130" x2="500" y2="190" />
    <line x1="150" y1="420" x2="138" y2="475" />
    <line x1="340" y1="485" x2="328" y2="540" />
    <line x1="480" y1="530" x2="466" y2="588" />
    <line x1="255" y1="640" x2="242" y2="695" />
  </g>
</svg>
