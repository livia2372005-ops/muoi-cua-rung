<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Minh họa rừng núi đá vôi mùa xuân và hoa tử huyền">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091611" />
      <stop offset="35%" stop-color="#132b22" />
      <stop offset="70%" stop-color="#214235" />
      <stop offset="100%" stop-color="#0c1d16" />
    </linearGradient>
    <radialGradient id="dawnGlow" cx="55%" cy="32%" r="46%">
      <stop offset="0%" stop-color="#f2d99b" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#9cb59c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#132b22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="karstFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4c3e" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#162d24" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="karstMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c382d" />
      <stop offset="100%" stop-color="#0e2019" />
    </linearGradient>
    <linearGradient id="karstNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10251c" />
      <stop offset="100%" stop-color="#07120e" />
    </linearGradient>
    <linearGradient id="mistBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dce7df" stop-opacity="0.02" />
      <stop offset="50%" stop-color="#e8efe8" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#dce7df" stop-opacity="0.02" />
    </linearGradient>
    <radialGradient id="flowerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf5" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#f5e6ba" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f5e6ba" stop-opacity="0" />
    </radialGradient>
    <filter id="mistBlur" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="petalGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <g id="blossom">
      <circle cx="0" cy="0" r="22" fill="url(#flowerAura)" />
      <g filter="url(#petalGlow)">
        <ellipse cx="0" cy="-10" rx="4.2" ry="8.5" fill="#fffdf7" />
        <ellipse cx="0" cy="-10" rx="4.2" ry="8.5" fill="#fffdf7" transform="rotate(72)" />
        <ellipse cx="0" cy="-10" rx="4.2" ry="8.5" fill="#faf4e6" transform="rotate(144)" />
        <ellipse cx="0" cy="-10" rx="4.2" ry="8.5" fill="#faf4e6" transform="rotate(216)" />
        <ellipse cx="0" cy="-10" rx="4.2" ry="8.5" fill="#fffdf7" transform="rotate(288)" />
        <circle cx="0" cy="0" r="3.2" fill="#d9b25f" />
        <circle cx="0" cy="0" r="1.4" fill="#fff9e2" />
      </g>
    </g>
  </defs>

  <!-- Base atmospheric sky -->
  <rect width="800" height="1000" fill="url(#skyGrad)" />
  <rect width="800" height="1000" fill="url(#dawnGlow)" />

  <!-- Subtle light rays -->
  <g opacity="0.11" fill="#f7e3ad">
    <polygon points="440,260 150,820 270,820" />
    <polygon points="460,260 360,860 510,860" />
    <polygon points="480,260 620,840 740,840" />
  </g>

  <!-- Distant misty limestone karst peaks -->
  <path d="M-20,620 L80,450 L150,490 L240,330 L330,430 L420,290 L520,410 L620,310 L720,430 L820,360 L820,1000 L-20,1000 Z" fill="url(#karstFar)" />
  <ellipse cx="400" cy="520" rx="460" ry="70" fill="url(#mistBand)" filter="url(#mistBlur)" />

  <!-- Midground limestone cliffs & valley (Hõm Chết canyon suggestion) -->
  <path d="M-20,680 L70,510 L180,580 L280,430 L365,560 L435,645 L510,510 L635,400 L740,510 L820,455 L820,1000 L-20,1000 Z" fill="url(#karstMid)" />
  <ellipse cx="380" cy="650" rx="440" ry="75" fill="url(#mistBand)" filter="url(#mistBlur)" />

  <!-- Foreground dark forest slope & mossy crags -->
  <path d="M-20,760 Q140,675 310,770 T620,745 Q730,710 820,765 L820,1000 L-20,1000 Z" fill="url(#karstNear)" />
  <path d="M-20,860 Q220,795 430,875 T820,845 L820,1000 L-20,1000 Z" fill="#06100c" />

  <!-- Distant pine/forest silhouettes along ridge -->
  <g fill="#0c2018" opacity="0.78">
    <path d="M120,660 Q145,595 168,660 Z" />
    <path d="M150,670 Q180,585 208,670 Z" />
    <path d="M555,650 Q585,570 615,650 Z" />
    <path d="M600,660 Q625,595 650,660 Z" />
  </g>

  <!-- Gnarled mossy tree branch framing left & upper canopy -->
  <path d="M-15,980 C25,820 45,670 30,520 C18,400 72,275 185,205 C265,155 370,150 475,182 C385,176 290,192 215,245 C120,312 84,420 96,545 C106,665 88,825 60,980 Z" fill="#07120e" />
  <path d="M98,425 C175,372 280,348 395,365 C300,375 205,402 125,462 Z" fill="#081510" />
  <path d="M170,222 C230,130 335,88 450,92 C352,115 268,158 202,235 Z" fill="#081510" />

  <!-- Right overhanging mossy bough -->
  <path d="M820,275 C725,255 625,270 535,320 C475,352 425,388 375,412 C442,395 510,368 575,342 C655,308 740,305 820,322 Z" fill="#07120e" />
  <path d="M685,288 C640,228 575,195 495,190 C562,212 618,244 655,294 Z" fill="#081510" />

  <!-- Mossy leaves and soft foliage clusters -->
  <g fill="#1c3d2f" opacity="0.88">
    <ellipse cx="185" cy="210" rx="28" ry="12" transform="rotate(-24 185 210)" />
    <ellipse cx="220" cy="185" rx="22" ry="10" transform="rotate(15 220 185)" />
    <ellipse cx="325" cy="164" rx="24" ry="10" transform="rotate(-10 325 164)" />
    <ellipse cx="645" cy="285" rx="26" ry="11" transform="rotate(20 645 285)" />
    <ellipse cx="585" cy="312" rx="24" ry="10" transform="rotate(-18 585 312)" />
    <ellipse cx="280" cy="378" rx="25" ry="10" transform="rotate(-12 280 378)" />
    <ellipse cx="145" cy="790" rx="34" ry="14" transform="rotate(-18 145 790)" />
    <ellipse cx="655" cy="805" rx="36" ry="15" transform="rotate(22 655 805)" />
  </g>

  <!-- Luminous Hoa Tử Huyền blossoms -->
  <use href="#blossom" transform="translate(260, 185) scale(1.15)" />
  <use href="#blossom" transform="translate(310, 165) scale(0.82)" />
  <use href="#blossom" transform="translate(410, 178) scale(0.95)" />
  <use href="#blossom" transform="translate(245, 378) scale(1.05)" />
  <use href="#blossom" transform="translate(335, 366) scale(0.75)" />
  <use href="#blossom" transform="translate(590, 315) scale(1.1)" />
  <use href="#blossom" transform="translate(532, 338) scale(0.85)" />
  <use href="#blossom" transform="translate(465, 372) scale(0.72)" />
  <use href="#blossom" transform="translate(152, 775) scale(1.25)" />
  <use href="#blossom" transform="translate(208, 795) scale(0.85)" />
  <use href="#blossom" transform="translate(648, 788) scale(1.2)" />
  <use href="#blossom" transform="translate(595, 815) scale(0.78)" />

  <!-- Gentle spring drizzle streaks -->
  <g stroke="#e8efe9" stroke-width="1" stroke-linecap="round" opacity="0.17">
    <line x1="120" y1="90" x2="105" y2="145" />
    <line x1="280" y1="60" x2="262" y2="128" />
    <line x1="470" y1="110" x2="454" y2="172" />
    <line x1="650" y1="75" x2="634" y2="140" />
    <line x1="190" y1="450" x2="174" y2="515" />
    <line x1="510" y1="460" x2="494" y2="528" />
    <line x1="690" y1="530" x2="672" y2="600" />
    <line x1="360" y1="590" x2="345" y2="650" />
    <line x1="420" y1="710" x2="405" y2="770" />
  </g>

  <!-- Soft drifting pollen / rain highlights -->
  <g fill="#fff8e0" opacity="0.45">
    <circle cx="385" cy="245" r="2.2" />
    <circle cx="495" cy="285" r="1.8" />
    <circle cx="315" cy="480" r="2.4" />
    <circle cx="460" cy="520" r="1.6" />
    <circle cx="565" cy="610" r="2.1" />
    <circle cx="240" cy="680" r="1.9" />
  </g>
</svg>
