<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Bi kịch ở vực Hõm Chết và khẩu súng rơi xuống vực sâu">
  <defs>
    <linearGradient id="hcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87b2b5" />
      <stop offset="55%" stop-color="#cbe1df" />
      <stop offset="100%" stop-color="#eef4f2" />
    </linearGradient>
    <linearGradient id="hcFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#hcSky)" />

  <!-- Twin canyon cliffs of Hõm Chết -->
  <path d="M0,120 L155,148 L205,360 L0,360 Z" fill="#465f54" />
  <path d="M480,105 L318,145 L278,360 L480,360 Z" fill="#394f45" />

  <!-- Swirling chasm mist -->
  <rect y="185" width="480" height="175" fill="url(#hcFog)" />
  <ellipse cx="240" cy="272" rx="145" ry="38" fill="#ffffff" opacity="0.6" />

  <!-- Mother monkey clinging on rocky cliff edge -->
  <g transform="translate(115, 118)">
    <ellipse cx="0" cy="14" rx="15" ry="18" fill="#6d4c3b" />
    <circle cx="-1" cy="-6" r="10.5" fill="#7c5744" />
    <circle cx="-1" cy="-4" r="6.5" fill="#dfb697" />
    <path d="M12,18 Q26,28 20,42" stroke="#6d4c3b" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Falling rifle silhouette into the misty chasm -->
  <g transform="translate(245, 224) rotate(48)">
    <rect x="-28" y="-3" width="56" height="5" rx="2" fill="#3a2f2a" />
    <rect x="-26" y="-5" width="22" height="8" rx="2" fill="#785035" />
  </g>

  <!-- Motion wind lines -->
  <g stroke="#5a7670" stroke-width="1.8" stroke-dasharray="6,6" opacity="0.6">
    <line x1="226" y1="140" x2="236" y2="205" />
    <line x1="258" y1="150" x2="265" y2="210" />
  </g>
</svg>
