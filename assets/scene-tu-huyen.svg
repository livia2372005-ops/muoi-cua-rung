<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Hoa tử huyền trắng muốt - Muối của rừng nở rộ trong mưa xuân">
  <defs>
    <linearGradient id="thBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9efe6" />
      <stop offset="60%" stop-color="#e9f8dd" />
      <stop offset="100%" stop-color="#87c66c" />
    </linearGradient>
    <g id="thBloom">
      <circle cx="0" cy="0" r="28" fill="#ffffff" opacity="0.45" />
      <ellipse cx="0" cy="-14" rx="6.5" ry="12" fill="#ffffff" stroke="#e4dcc8" stroke-width="0.8" />
      <ellipse cx="0" cy="-14" rx="6.5" ry="12" fill="#fffef9" stroke="#e4dcc8" stroke-width="0.8" transform="rotate(72)" />
      <ellipse cx="0" cy="-14" rx="6.5" ry="12" fill="#fffef9" stroke="#e4dcc8" stroke-width="0.8" transform="rotate(144)" />
      <ellipse cx="0" cy="-14" rx="6.5" ry="12" fill="#ffffff" stroke="#e4dcc8" stroke-width="0.8" transform="rotate(216)" />
      <ellipse cx="0" cy="-14" rx="6.5" ry="12" fill="#ffffff" stroke="#e4dcc8" stroke-width="0.8" transform="rotate(288)" />
      <circle cx="0" cy="0" r="5" fill="#eab23e" />
      <circle cx="0" cy="0" r="2" fill="#fff6cc" />
    </g>
  </defs>

  <rect width="480" height="360" fill="url(#thBg)" />
  <circle cx="240" cy="145" r="110" fill="#fffef2" opacity="0.55" />

  <!-- Green hillside -->
  <path d="M0,255 Q160,210 310,250 T480,235 L480,360 L0,360 Z" fill="#5da951" />
  <path d="M0,295 Q220,262 480,295 L480,360 L0,360 Z" fill="#468e3d" />

  <!-- Delicate thorny twigs carrying white Hoa Tử Huyền blossoms -->
  <path d="M60,265 C140,210 215,175 305,155 C355,144 402,148 438,136" stroke="#5a4938" stroke-width="4.5" fill="none" stroke-linecap="round" />
  <path d="M165,205 C185,158 212,126 248,104" stroke="#5a4938" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <g fill="#42894a">
    <ellipse cx="145" cy="212" rx="16" ry="7" transform="rotate(-35 145 212)" />
    <ellipse cx="290" cy="168" rx="18" ry="8" transform="rotate(22 290 168)" />
    <ellipse cx="362" cy="144" rx="15" ry="7" transform="rotate(-15 362 144)" />
  </g>

  <use href="#thBloom" transform="translate(245, 114) scale(1.15)" />
  <use href="#thBloom" transform="translate(320, 148) scale(1.25)" />
  <use href="#thBloom" transform="translate(185, 178) scale(0.95)" />
  <use href="#thBloom" transform="translate(396, 134) scale(0.88)" />
  <use href="#thBloom" transform="translate(115, 232) scale(0.82)" />

  <!-- Spring rain sparkle -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
    <line x1="78" y1="45" x2="70" y2="75" />
    <line x1="185" y1="35" x2="177" y2="68" />
    <line x1="355" y1="48" x2="346" y2="82" />
    <line x1="435" y1="75" x2="426" y2="108" />
  </g>
</svg>
